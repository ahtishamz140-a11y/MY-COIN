<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY COIN</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

h1{
  margin:0 0 5px;
}

.subtitle{
  color:#9aa8ba;
  margin-bottom:20px;
}

.section{
  background:#101a2b;
  border:1px solid #29394f;
  border-radius:12px;
  margin-bottom:18px;
  overflow:hidden;
}

.section h2{
  margin:0;
  padding:15px;
}

.description{
  color:#9aa8ba;
  font-size:13px;
  padding:0 15px 12px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  border-top:1px solid #26354a;
  text-align:right;
  white-space:nowrap;
}

th:first-child,
td:first-child{
  text-align:left;
}

th{
  color:#9aa8ba;
  font-size:12px;
}

.coin{
  font-weight:bold;
}

.green{
  color:#35df89;
}

.red{
  color:#ff6878;
}

.empty{
  padding:18px;
  color:#9aa8ba;
}

.status{
  margin-bottom:18px;
  padding:10px;
  background:#111c2e;
  border-radius:8px;
  color:#b9c5d5;
}
</style>
</head>

<body>

<div class="container">

<h1>MY COIN</h1>
<div class="subtitle">Binance USDT Spot Scanner</div>

<div class="status" id="status">
Loading market data...
</div>


<!-- 1. SEVEN DAYS -->

<div class="section">

<h2>🟢 7 Days</h2>

<div class="description">
Coins with 7 Day percentage above +10%
</div>

<div id="sevenDays"></div>

</div>


<!-- 2. 24 HOURS -->

<div class="section">

<h2>🔵 24 Hours</h2>

<div class="description">
Coins with 24 Hour percentage above +5%
</div>

<div id="twentyFourHours"></div>

</div>


<!-- 3. 1 HOUR RSI -->

<div class="section">

<h2>🟡 1 Hour RSI</h2>

<div class="description">
Coins with 1 Hour RSI between 25 and 55
</div>

<div id="rsiCoins"></div>

</div>


<!-- 4. ALL CONDITIONS -->

<div class="section">

<h2>⭐ All Conditions Match</h2>

<div class="description">
Coins matching 7D +10%, 24H +5% and RSI 25–55
</div>

<div id="allConditions"></div>

</div>

</div>


<script>

const API = "https://api.binance.com/api/v3";


// -------------------------
// RSI CALCULATION
// -------------------------

function calculateRSI(closes, period = 14){

    if(closes.length <= period){
        return NaN;
    }

    let gains = 0;
    let losses = 0;

    for(let i = 1; i <= period; i++){

        const change = closes[i] - closes[i-1];

        if(change > 0){
            gains += change;
        }else{
            losses -= change;
        }

    }

    let averageGain = gains / period;
    let averageLoss = losses / period;

    for(let i = period + 1; i < closes.length; i++){

        const change = closes[i] - closes[i-1];

        const gain = Math.max(change,0);
        const loss = Math.max(-change,0);

        averageGain =
            ((averageGain * (period - 1)) + gain) / period;

        averageLoss =
            ((averageLoss * (period - 1)) + loss) / period;

    }

    if(averageLoss === 0){
        return 100;
    }

    const rs = averageGain / averageLoss;

    return 100 - (100 / (1 + rs));
}


// -------------------------
// NUMBER FORMAT
// -------------------------

function formatPrice(value){

    if(value >= 1){
        return value.toFixed(2);
    }

    return value.toFixed(6);
}


function formatPercent(value){

    const color = value >= 0 ? "green" : "red";

    const sign = value >= 0 ? "+" : "";

    return `<span class="${color}">
    ${sign}${value.toFixed(2)}%
    </span>`;
}


// -------------------------
// TABLE
// -------------------------

function makeTable(coins){

    if(coins.length === 0){

        return `
        <div class="empty">
        No matching coins right now.
        </div>
        `;

    }

    let html = `

    <div class="table-wrap">

    <table>

    <thead>

    <tr>

    <th>Coin</th>
    <th>Price</th>
    <th>1 Hour %</th>
    <th>24 Hour %</th>
    <th>7 Day %</th>
    <th>RSI</th>
    <th>24 Hours Volume</th>

    </tr>

    </thead>

    <tbody>
    `;


    coins.forEach(coin => {

        html += `

        <tr>

        <td class="coin">
        ${coin.sym}
        </td>

        <td>
        ${formatPrice(coin.price)}
        </td>

        <td>
        ${formatPercent(coin.oneHour)}
        </td>

        <td>
        ${formatPercent(coin.day)}
        </td>

        <td>
        ${formatPercent(coin.sevenDay)}
        </td>

        <td>
        ${coin.rsi.toFixed(2)}
        </td>

        <td>
        ${Number(coin.volume).toLocaleString()}
        </td>

        </tr>

        `;

    });


    html += `
    </tbody>
    </table>
    </div>
    `;

    return html;
}


// -------------------------
// GET DATA
// -------------------------

async function getJSON(url){

    const response = await fetch(url);

    if(!response.ok){
        throw new Error("API Error");
    }

    return response.json();
}


// -------------------------
// MAIN SCANNER
// -------------------------

async function scan(){

    document.getElementById("status").innerText =
    "Scanning Binance coins...";


    try{

        const ticker =
        await getJSON(API + "/ticker/24hr");


        // USDT coins only
        const usdtCoins =
        ticker.filter(x =>
            x.symbol.endsWith("USDT")
        );


        // Highest volume first
        usdtCoins.sort(
            (a,b) =>
            Number(b.quoteVolume) -
            Number(a.quoteVolume)
        );


        // Scan top 100 volume coins
        const selected =
        usdtCoins.slice(0,100);


        const results = [];


        for(const tickerCoin of selected){

            try{

                const symbol =
                tickerCoin.symbol;


                // 1 Hour candles
                const hourly =
                await getJSON(
                `${API}/klines?symbol=${symbol}&interval=1h&limit=30`
                );


                // Daily candles
                const daily =
                await getJSON(
                `${API}/klines?symbol=${symbol}&interval=1d&limit=8`
                );


                const hourlyCloses =
                hourly.map(x => Number(x[4]));


                const dailyCloses =
                daily.map(x => Number(x[4]));


                // 1 hour percentage
                const oneHour =
                (
                    (hourlyCloses.at(-1) /
                    hourlyCloses.at(-2))
                    - 1
                ) * 100;


                // 7 day percentage
                const sevenDay =
                (
                    (dailyCloses.at(-1) /
                    dailyCloses[0])
                    - 1
                ) * 100;


                // RSI
                const rsi =
                calculateRSI(hourlyCloses);


                results.push({

                    sym:
                    symbol.replace("USDT","/USDT"),

                    price:
                    Number(tickerCoin.lastPrice),

                    oneHour:
                    oneHour,

                    day:
                    Number(tickerCoin.priceChangePercent),

                    sevenDay:
                    sevenDay,

                    rsi:
                    rsi,

                    volume:
                    Number(tickerCoin.quoteVolume)

                });

            }catch(error){

                // Skip coins with unavailable data

            }

        }


        // -------------------------
        // FOUR SEPARATE PORTIONS
        // -------------------------


        // 1. 7 DAYS ONLY
        const sevenDays =
        results.filter(coin =>
            coin.sevenDay > 10
        );


        // 2. 24 HOURS ONLY
        const twentyFourHours =
        results.filter(coin =>
            coin.day > 5
        );


        // 3. RSI ONLY
        const rsiCoins =
        results.filter(coin =>
            coin.rsi >= 25 &&
            coin.rsi <= 55
        );


        // 4. ALL THREE TOGETHER
        const allConditions =
        results.filter(coin =>
            coin.sevenDay > 10 &&
            coin.day > 5 &&
            coin.rsi >= 25 &&
            coin.rsi <= 55
        );


        // -------------------------
        // SHOW THE FOUR PORTIONS
        // -------------------------

        document.getElementById("sevenDays").innerHTML =
        makeTable(sevenDays);


        document.getElementById("twentyFourHours").innerHTML =
        makeTable(twentyFourHours);


        document.getElementById("rsiCoins").innerHTML =
        makeTable(rsiCoins);


        document.getElementById("allConditions").innerHTML =
        makeTable(allConditions);


        document.getElementById("status").innerText =
        `Updated: ${new Date().toLocaleTimeString()} | ${results.length} coins scanned`;

    }catch(error){

        document.getElementById("status").innerText =
        "Could not load Binance data. Please refresh the page.";

    }

}


// START
scan();

</script>

</body>
</html>
